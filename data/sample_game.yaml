模块耦合关系:
  - 来源模块: "新手引导"
    影响模块: "D1 留存"
    关系类型: "正向驱动"
    影响逻辑: "新手引导帮助用户完成首个核心循环，若首局顺畅且奖励明确，用户更容易次日回访。"
    指标: "新手完成率、首局完成率、D1 留存"
    潜在风险: "强制引导过长可能提升理解但降低完成率。"
    验证方法: "新手漏斗 + D1 留存分群 + 引导长度 A/B Test"
  - 来源模块: "广告激励"
    影响模块: "收入和用户体验"
    关系类型: "双向影响"
    影响逻辑: "广告提升非付费收入并提供失败补偿，但过频会增加退出和流失。"
    指标: "激励广告观看率、广告收入、广告后退出率、广告后留存"
    潜在风险: "短期广告收入提升可能伤害长期 LTV。"
    验证方法: "广告频控 A/B Test，观察收入和留存护栏指标"

优化建议:
  - 标题: "缩短新手强制引导，提高首局完成率和 D1 留存"
    当前问题: "前 3 关均包含强制教学，可能让有三消经验的用户感到节奏慢。"
    问题证据:
      - "体验观察：前期系统说明较集中，用户在获得自由操作前需要等待多次提示。"
      - "待验证数据：新手第 2 关和第 3 关步骤完成率是否明显下降。"
    影响用户:
      - "新用户"
      - "有三消经验的回流用户"
    影响指标:
      - "新手完成率"
      - "首局完成率"
      - "D1 留存"
    优化方案: "将强制引导压缩到第 1 关，后续关卡改为弱提示；对快速完成前两步的用户展示跳过按钮。"
    预期收益: "降低入门阻力，让更多用户完成首个核心循环，并提升次日回访概率。"
    潜在风险:
      - "部分完全新手可能理解不足。"
      - "跳过后可能影响道具认知和后续付费转化。"
    A/B Test 验证方案:
      实验对象: "新增用户"
      对照组: "原 3 关强制引导"
      实验组: "1 关强制引导 + 后续弱提示 + 可跳过"
      核心指标: "新手完成率、首局完成率、D1 留存"
      护栏指标: "第 5 关通过率、道具使用率、客服反馈"
      实验周期: "至少 7 天，覆盖 D1 和初步 D7 观察"
    成功判断标准: "新手完成率和 D1 留存显著提升，且第 5 关通过率不下降。"
  - 标题: "优化广告复活频控，在收入和留存之间取得平衡"
    当前问题: "失败后广告复活价值明确，但如果连续失败时反复出现广告入口，可能让用户感到被打扰。"
    问题证据:
      - "体验观察：关卡失败页是广告最强触点。"
      - "待验证数据：广告观看次数较高用户的广告后退出率和 D1 留存。"
    影响用户:
      - "非付费用户"
      - "连续失败用户"
      - "轻付费潜力用户"
    影响指标:
      - "激励广告观看率"
      - "广告收入"
      - "广告后退出率"
      - "D7 留存"
    优化方案: "按连续失败次数和用户付费倾向设置广告频控；第 1 次失败优先给免费提示，第 2 次失败展示广告复活，第 3 次后提供道具礼包或降难补偿。"
    预期收益: "保留广告收入，同时降低广告疲劳和失败后流失。"
    潜在风险:
      - "广告展示次数下降可能短期影响收入。"
      - "免费补偿过多可能降低道具购买。"
    A/B Test 验证方案:
      实验对象: "第 20 关后且近 7 日未付费用户"
      对照组: "原广告复活策略"
      实验组: "失败次数分层频控策略"
      核心指标: "广告后留存、失败后继续率、广告 ARPU"
      护栏指标: "付费率、关卡通过率、投诉率"
      实验周期: "14 天，观察 D7 留存和广告收入"
    成功判断标准: "广告后留存和失败后继续率提升，广告 ARPU 不低于对照组 95%。"

面试表达版总结:
  项目背景: "我用虚构休闲三消游戏《星糖消消乐》搭建了一套可复用的游戏产品拆解和数据分析报告框架。"
  分析目标: "目标是展示我能从用户需求、核心玩法、模块设计和指标体系出发，提出可验证的产品优化建议。"
  拆解方法: "我采用用户路径、功能模块、指标体系、模块耦合和 A/B Test 五层拆解方法。"
  核心发现:
    - "新手引导对首局完成率和 D1 留存影响最大，应平衡教学充分性和流程长度。"
    - "任务系统是日常活跃和 D7 留存的核心牵引器，但需要避免任务疲劳。"
    - "激励广告能提升非付费收入，但必须用广告后留存和退出率作为护栏指标。"
  指标体系设计: "我将指标分为新增、活跃、留存、付费、转化、关卡、经济、广告、社交、分层和异常监控，并为每个指标定义口径和业务意义。"
  优化方案: "我提出了新手引导压缩和广告频控两类优化，并设计了实验对象、核心指标、护栏指标和成功标准。"
  验证方法: "如果有真实数据，我会用漏斗分析定位流失，用分群留存验证模块价值，用 A/B Test 验证优化收益。"
