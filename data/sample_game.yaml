产品基础信息:
  产品名称: "星糖消消乐"
  游戏类型: "休闲三消 + 轻成长"
  目标用户: "18-35 岁碎片时间休闲用户，包含通勤、睡前和短休场景用户"
  核心玩法: "用户通过交换糖果完成三消目标，获得星星、金币和装饰资源，推动关卡、任务和家园成长。"
  商业化模式: "激励广告 + 道具内购 + 新手礼包 + 战令"
  体验版本: "v1.0 虚构体验版"
  体验时间: "2026-05-18"
  分析目标: "搭建一份面向游戏数据分析岗位的结构化作品集案例，重点展示留存、活跃、付费、广告和 A/B Test 思维。"

产品定位分析:
  用户需求:
    - "在碎片时间获得低门槛、即时反馈的放松体验。"
    - "通过关卡推进、星级评价和家园装饰获得持续目标感。"
    - "在失败或卡关时获得可接受的帮助，而不是被强迫付费。"
  使用场景:
    - 场景: "通勤或排队"
      用户状态: "时间短，希望快速进入一局"
      产品价值: "单局 1-3 分钟，操作简单，失败成本低"
      指标: "启动次数、单局完成率、平均对局时长"
    - 场景: "睡前放松"
      用户状态: "希望轻松消磨时间"
      产品价值: "连续关卡、柔和反馈、任务奖励"
      指标: "人均在线时长、连续关卡数、D7 留存"
    - 场景: "卡关后求助"
      用户状态: "有挫败但仍想继续"
      产品价值: "激励广告复活、道具提示、好友求助"
      指标: "失败后继续率、广告观看率、道具使用率"
  产品卖点:
    - "三消核心规则简单，首局理解成本低。"
    - "家园装饰把关卡奖励转化为可感知成长。"
    - "激励广告嵌入失败补偿和额外奖励，商业化不直接打断核心操作。"
  差异化竞争点:
    - "相比纯关卡三消，增加轻家园装饰，强化中期留存。"
    - "相比强付费三消，优先使用激励广告和低价礼包承接非付费用户。"
  目标用户画像:
    - 名称: "碎片休闲用户"
      用户特征: "每天多次短时打开，不追求复杂策略"
      主要需求: "快速开局、快速反馈、低挫败"
      关键指标: "启动次数、首局开始率、单局完成率"
    - 名称: "成长收集用户"
      用户特征: "愿意连续完成任务和活动"
      主要需求: "明确目标、可见成长、阶段奖励"
      关键指标: "任务完成率、D7 留存、活动参与率"
    - 名称: "轻付费用户"
      用户特征: "卡关或遇到高价值礼包时愿意小额付费"
      主要需求: "价格合理、价值明确、即时到账"
      关键指标: "首付转化率、ARPPU、复购率"
  用户为什么要玩: "用户玩这款游戏，是为了在低压力场景下获得即时消除爽感，并通过星级、任务和家园装饰形成持续目标。"

核心玩法拆解:
  核心循环:
    - "进入关卡并理解本关目标。"
    - "通过交换糖果完成消除。"
    - "获得连击、特效和星级反馈。"
    - "通关后获得金币、星星和装饰资源。"
    - "使用资源升级家园或完成任务。"
    - "任务、活动和新关卡继续制造下一轮目标。"
  完整路径:
    - 步骤: "打开游戏"
      用户行为: "查看首页任务和继续关卡"
      系统反馈: "展示主线关卡、签到和限时活动"
      用户心理: "判断今天是否有值得完成的目标"
      可能流失点: "弹窗过多或目标混乱"
      指标: "启动成功率、首页点击率"
    - 步骤: "进入关卡"
      用户行为: "选择当前关卡并开始"
      系统反馈: "展示目标、步数和可用道具"
      用户心理: "判断规则是否清楚、难度是否可接受"
      可能流失点: "目标理解困难或加载慢"
      指标: "关卡开始率、加载完成率"
    - 步骤: "结算奖励"
      用户行为: "领取金币、星星和任务进度"
      系统反馈: "奖励到账、任务完成提示、下一关入口"
      用户心理: "感到本局有收益，愿意进入下一轮"
      可能流失点: "奖励价值不清或下一目标不明确"
      指标: "奖励领取率、下一关点击率"
  核心爽点:
    - "连消和特效带来的即时视觉反馈。"
    - "有限步数内完成目标的轻策略感。"
    - "通关奖励能用于家园装饰，形成可视化成长。"
  成长路径:
    - "短期：完成首关、获得首个三星、解锁第一个道具。"
    - "中期：完成每日任务、解锁家园区域、参与限时活动。"
    - "长期：收集主题装饰、完成赛季通行证、冲击好友排行榜。"
  目标反馈成就:
    目标感: "首页同时展示主线关卡、每日任务和家园目标，给用户明确下一步。"
    反馈感: "关卡中通过连击、特效、震动和星级强化正反馈。"
    成就感: "通过家园装饰、星级收集和排行榜展示用户积累成果。"

功能模块拆解:
  - 模块名称: "新手引导"
    模块入口: "首次进入游戏自动触发，覆盖前 3 个关卡"
    模块功能描述: "通过逐步教学让用户理解交换、消除、目标、步数和道具使用。"
    用户侧作用: "降低规则理解成本，让用户快速获得首个通关反馈。"
    产品侧作用: "提高激活后的首局完成率和 D1 留存。"
    商业化作用: "为后续道具、礼包和广告复活建立认知基础。"
    留存作用: "帮助用户完成首个核心循环，形成次日回访理由。"
    活跃作用: "引导用户进入主线关卡和任务系统。"
    社交传播作用: "暂不承担强社交传播，主要为后续排行榜和邀请做铺垫。"
    设计动机推测: "休闲游戏用户耐心较低，新手期必须用最短路径完成理解、操作和奖励闭环。"
    设计优点:
      - "教学和真实关卡结合，减少割裂感。"
      - "每一步只教当前必要操作。"
      - "首关难度低，保证用户快速获得胜利。"
    潜在风险:
      - "如果强制步骤过多，会降低跳过意愿强的新用户耐心。"
      - "过早展示过多系统入口，可能造成信息过载。"
    可优化方向:
      - "将非核心系统延后到第 4 关后再开放。"
      - "对有三消经验用户提供跳过或简化引导。"
      - "在首关结算强化下一目标提示。"
    关联模块:
      - "主线关卡"
      - "任务系统"
      - "道具系统"
    关键指标:
      - 指标名称: "新手完成率"
        指标定义: "开始新手引导后完成全部关键步骤的用户占比"
        计算口径: "新手完成 UV / 新手开始 UV"
        业务意义: "判断首日入门阻力"
      - 指标名称: "首局完成率"
        指标定义: "开始第一关后成功完成结算的用户占比"
        计算口径: "第一关结算 UV / 第一关开始 UV"
        业务意义: "判断核心玩法是否能被快速接受"
      - 指标名称: "D1 留存"
        指标定义: "新增用户次日回访比例"
        计算口径: "次日回访新增用户 / 当日新增用户"
        业务意义: "判断首日体验是否形成回访"
    指标异常时的可能原因:
      - "新手完成率低：可能是引导过长、文案不清、加载慢或首关目标复杂。"
      - "首局完成率低：可能是难度过高、操作反馈不明显或设备性能问题。"
      - "D1 留存低：可能是首日目标断层，用户不知道次日回来做什么。"
    可验证的数据分析方法:
      - "新手漏斗：启动 -> 第一关开始 -> 教学步骤完成 -> 第一关结算 -> 第二关开始。"
      - "按渠道、设备、年龄段拆分新手完成率。"
      - "A/B Test 对比强制引导和轻引导对 D1 留存的影响。"

  - 模块名称: "主线关卡"
    模块入口: "首页中央继续按钮和地图节点"
    模块功能描述: "用户持续挑战三消关卡，消耗步数完成目标并获得星级和资源。"
    用户侧作用: "提供核心消除体验、挑战感和连续推进目标。"
    产品侧作用: "承载主要活跃时长、关卡消耗、道具使用和内容进度。"
    商业化作用: "在卡关、步数不足和活动冲榜场景中承接道具购买和广告复活。"
    留存作用: "通过关卡难度曲线和章节目标推动中长期留存。"
    活跃作用: "每日任务和活动会反复引导用户回到主线关卡。"
    社交传播作用: "通过好友进度和排行榜制造轻竞争。"
    设计动机推测: "主线关卡是三消游戏的核心内容消耗单位，也是其他系统的行为基础。"
    设计优点:
      - "关卡目标清晰，适合碎片时间。"
      - "星级评价能增加重复挑战动机。"
      - "失败后自然承接道具、广告和求助。"
    潜在风险:
      - "难度曲线过陡会造成中期用户流失。"
      - "关卡目标重复会导致疲劳。"
      - "过度卡关可能被用户理解为强迫付费。"
    可优化方向:
      - "建立关卡失败率、道具使用率和退出率监控。"
      - "对连续失败用户提供动态帮助。"
      - "将高难关卡与活动或社交求助结合，降低挫败。"
    关联模块:
      - "新手引导"
      - "任务系统"
      - "广告激励"
      - "商城"
    关键指标:
      - 指标名称: "关卡开始率"
        指标定义: "活跃用户中开始至少一局关卡的比例"
        计算口径: "关卡开始 UV / DAU"
        业务意义: "判断核心玩法参与度"
      - 指标名称: "关卡通过率"
        指标定义: "关卡成功通关次数占开始次数比例"
        计算口径: "通关次数 / 开始次数"
        业务意义: "判断难度是否合理"
      - 指标名称: "失败后继续率"
        指标定义: "失败后继续挑战或使用复活的比例"
        计算口径: "失败后继续 UV / 失败 UV"
        业务意义: "判断挫败后的承接能力"
    指标异常时的可能原因:
      - "关卡开始率低：首页目标不清、任务引导弱或用户内容疲劳。"
      - "关卡通过率低：难度过高、机制说明不足或关卡 Bug。"
      - "失败后继续率低：复活价值弱、广告奖励弱或用户挫败过强。"
    可验证的数据分析方法:
      - "按关卡 ID 绘制通过率和平均失败次数分布。"
      - "比较连续失败用户和普通用户后续留存。"
      - "测试失败补偿策略对继续率和广告收入的影响。"

  - 模块名称: "广告激励"
    模块入口: "关卡失败页、奖励翻倍、每日免费礼包"
    模块功能描述: "用户观看激励视频后获得复活、额外金币、道具或奖励翻倍。"
    用户侧作用: "非付费用户可以用时间换资源，降低卡关挫败。"
    产品侧作用: "提升非付费用户收入贡献，并延长会话。"
    商业化作用: "承担广告收入，补充低付费率用户变现。"
    留存作用: "合理使用可以降低失败后的流失，但过频会伤害体验。"
    活跃作用: "奖励翻倍和免费礼包能增加日常回访理由。"
    社交传播作用: "社交传播较弱，可与分享奖励结合。"
    设计动机推测: "休闲游戏付费率有限，激励广告是兼顾用户补偿和收入的重要方式。"
    设计优点:
      - "用户主动选择观看，打断感相对较低。"
      - "与失败补偿结合，价值感明确。"
      - "能覆盖非付费用户商业化。"
    潜在风险:
      - "频率过高会降低留存。"
      - "奖励过强可能削弱内购。"
      - "广告加载失败会造成负体验。"
    可优化方向:
      - "按用户付费倾向和失败次数做广告频控。"
      - "将广告奖励与关卡难度和用户库存动态匹配。"
      - "监控广告后退出率和广告后留存。"
    关联模块:
      - "主线关卡"
      - "任务系统"
      - "商城"
    关键指标:
      - 指标名称: "激励广告观看率"
        指标定义: "活跃用户中观看激励广告的比例"
        计算口径: "激励广告观看 UV / DAU"
        业务意义: "判断广告入口和奖励吸引力"
      - 指标名称: "广告完成率"
        指标定义: "完整看完广告的播放占比"
        计算口径: "广告完成次数 / 广告开始次数"
        业务意义: "判断广告播放体验和素材质量"
      - 指标名称: "广告后留存"
        指标定义: "看广告用户次日回访比例"
        计算口径: "看广告用户次日回访 UV / 看广告 UV"
        业务意义: "判断广告是否伤害长期体验"
    指标异常时的可能原因:
      - "观看率低：奖励价值弱、入口不明显或用户资源不缺。"
      - "完成率低：广告过长、加载慢或素材质量差。"
      - "收入高但留存低：广告频率可能透支体验。"
    可验证的数据分析方法:
      - "按广告触发场景比较观看率和后续留存。"
      - "A/B Test 不同广告频控策略。"
      - "观察广告观看与内购转化的替代或互补关系。"

用户体验路径分析:
  新用户路径:
    - 步骤: "首次打开"
      用户行为: "进入游戏并完成登录"
      用户心理: "好奇但耐心有限"
      可能流失原因: "加载慢、权限多、首屏弹窗复杂"
      指标: "激活率、加载完成率"
      优化策略: "减少首屏干扰，先让用户进入第一局"
    - 步骤: "完成首关"
      用户行为: "跟随引导完成三消"
      用户心理: "希望快速确认是否好玩"
      可能流失原因: "规则不清或反馈不强"
      指标: "新手完成率、首局完成率"
      优化策略: "减少教学步骤，强化首胜奖励"
  老用户日常路径:
    - 步骤: "每日登录"
      用户行为: "查看任务、签到和继续关卡"
      用户心理: "寻找今日目标"
      可能流失原因: "目标重复或奖励弱"
      指标: "DAU、任务点击率"
      优化策略: "聚合日常目标，做奖励分层"
  付费用户路径:
    - 步骤: "卡关触发礼包"
      用户行为: "查看道具礼包或复活方案"
      用户心理: "评估是否值得花钱"
      可能流失原因: "价格不清、付费压迫"
      指标: "首付转化率、支付成功率"
      优化策略: "用低价高价值礼包承接首次付费"
  流失用户可能卡点:
    - 步骤: "连续失败"
      用户行为: "多次挑战同一关卡失败"
      用户心理: "挫败，怀疑被逼付费"
      可能流失原因: "难度陡增、补偿不足"
      指标: "连续失败次数、失败后退出率"
      优化策略: "动态提示、免费道具、广告复活"
  回流用户路径:
    - 步骤: "回流登录"
      用户行为: "领取回归奖励并查看新活动"
      用户心理: "判断是否值得重新投入"
      可能流失原因: "内容陌生、追赶压力大"
      指标: "回流率、回流 D1 留存"
      优化策略: "提供回归任务和低门槛追赶奖励"

数据指标体系:
  新增指标:
    - 指标名称: "新增用户数"
      指标定义: "首次激活或注册的用户数"
      计算口径: "去重后的新增用户 UV"
      适用模块: "投放、登录、新手引导"
      业务意义: "衡量获客规模"
      升高说明: "渠道放量或素材有效"
      下降说明: "投放衰减、包体问题或渠道质量变化"
      优化方向: "优化投放素材、落地页和首启速度"
  活跃指标:
    - 指标名称: "DAU"
      指标定义: "当日至少登录或发生核心行为的用户数"
      计算口径: "当日活跃 UV"
      适用模块: "全局、任务、活动"
      业务意义: "衡量活跃规模"
      升高说明: "活动、任务或内容吸引力增强"
      下降说明: "内容疲劳或召回不足"
      优化方向: "优化日常目标和活动节奏"
  留存指标:
    - 指标名称: "D1 留存"
      指标定义: "新增用户次日回访比例"
      计算口径: "次日回访新增用户 / 当日新增用户"
      适用模块: "新手引导、首局、首日任务"
      业务意义: "衡量首日体验是否成立"
      升高说明: "新手路径和首日目标有效"
      下降说明: "首局体验差或次日目标弱"
